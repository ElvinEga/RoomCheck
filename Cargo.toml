[package]
name = "roomcheck"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["xtask"]

[dependencies]
nice-plug = { version = "0.4", features = ["standalone"] }
nice-plug-egui = "0.6"
rt-fft-convolver = "0.2"
ebur128-stream = "0.2"
realfft = "3.5"
rtrb = "0.4"
triple_buffer = "9"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.18"
egui = "0.37"

[profile.release]
lto = "thin"
strip = "symbols"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
